name: Docker Release

# 复用组织级 Secrets/Variables，发布 amd64/arm64 镜像到 Docker Hub。
# 手动运行仅推 SHA 标签；正式版本 tag 推版本标签与 latest。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_ACCESSTOKEN: ${{ secrets.DOCKERHUB_ACCESSTOKEN }}
        run: |
          for name in DOCKERHUB_USERNAME DOCKERHUB_ACCESSTOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::缺少 Actions Secret：$name，请检查组织级授权范围。"
              exit 1
            fi
          done

      - name: Set up QEMU（arm64 交叉模拟）
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESSTOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/workbuddy2api-panel
          # 禁止 metadata-action 自动给手动运行或预发布版本附加 latest。
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref_type == 'tag' && !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 沿用既有镜像清单格式。
          provenance: false

      - name: Verify pushed image tags
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image; do
            [[ -n "$image" ]] || continue
            docker buildx imagetools inspect "$image" --raw | jq -e '
              any(.manifests[]; .platform.os == "linux" and .platform.architecture == "amd64")
              and any(.manifests[]; .platform.os == "linux" and .platform.architecture == "arm64")
            '
          done <<< "$IMAGE_TAGS"

  notify:
    name: Email workflow result
    needs: [build-and-publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Send workflow result email
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ vars.SMTP_HOST }}
          server_port: ${{ vars.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.SMTP_FROM }}
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          subject: "[${{ github.repository }}] Docker 发布 ${{ github.ref_name }}：${{ needs.build-and-publish.result }}"
          body: |
            仓库：${{ github.repository }}
            触发方式：${{ github.event_name }}
            引用：${{ github.ref_name }}
            提交：${{ github.sha }}
            构建与推送：${{ needs.build-and-publish.result }}
            运行详情：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
